<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - 4 Star Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .thank-you-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .icon-circle {
      width: 60px;
      height: 60px;
      background-color: #ecfdf5;
      color: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }

    .icon-circle svg {
      width: 32px;
      height: 32px;
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .message {
      font-size: 15px;
      line-height: 1.5;
      color: #475569;
      margin-bottom: 24px;
    }

    .btn-home {
      display: block;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
      margin-bottom: 20px;
    }

    .btn-home:hover {
      background-color: #1d4ed8;
    }

    .support-text {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #16a34a;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .btn-whatsapp:hover {
      background-color: #dcfce7;
    }

    .btn-whatsapp svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

  <div class="thank-you-card">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24">
        <path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
    </div>

    <h2>Thank You!</h2>
    <p class="message">
      We have received your enquiry. The <strong>4 STAR MOBILE</strong> team will contact you shortly.
    </p>

    <!-- Home page ka link yahan check kar lijiye (jaise index.html ya ./) -->
    <a href="index.html" class="btn-home">Return to Home Page</a>

    <div class="support-text">Need urgent help?</div>
    <!-- Apna WhatsApp number 91 ke baad daalein -->
    <a href="https://wa.me/91XXXXXXXXXX?text=Hi%204%20Star%20Mobile,%20I%20have%20an%20urgent%20enquiry" class="btn-whatsapp" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24">
        <path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 6.46 17.5 2 12.04 2M12.05 3.67C16.58 3.67 20.28 7.37 20.28 11.92C20.28 16.46 16.58 20.17 12.05 20.17C10.57 20.17 9.17 19.77 7.96 19.06L7.66 18.88L4.54 19.7L5.38 16.66L5.18 16.34C4.39 15.08 3.97 13.52 3.97 11.91C3.97 7.37 7.67 3.67 12.05 3.67Z"/>
      </svg>
      Chat on WhatsApp
    </a>
  </div>

  <!-- Auto-redirect to home page after 5 seconds (Optional) -->
  <script>
    setTimeout(function() {
      window.location.href = "index.html";
    }, 5000);
  </script>

</body>
</html>
