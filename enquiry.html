<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Enquiry - 4 Star Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .form-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .form-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .form-header p {
      font-size: 14px;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background-color: #ffffff;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-submit {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #64748b;
      text-decoration: none;
    }

    .back-link:hover {
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-header">
      <h2>Quick Enquiry</h2>
      <p>Fill out the form below and we will get back to you.</p>
    </div>

    <!-- Action mein apni Thank You file ka URL/naam rakhein -->
    <form action="thank-you.html" method="POST">
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" required>
      </div>

      <div class="form-group">
        <label for="service">Service / Requirement</label>
        <select id="service" name="service" required>
          <option value="" disabled selected>Select an option</option>
          <option value="Mobile Repair">Mobile Repair / Display Change</option>
          <option value="Accessories">Accessories & Spare Parts</option>
          <option value="Other">Other Enquiry</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Message / Details (Optional)</label>
        <textarea id="message" name="message" placeholder="Describe your model or issue..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Submit Enquiry</button>
    </form>

    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

</body>
</html>
