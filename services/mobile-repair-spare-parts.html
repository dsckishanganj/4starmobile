<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../logo-round.png">
<title>Mobile Spare Parts & Model Compatibility Catalog | 4 STAR MOBILE</title>
<meta name="description" content="Search genuine mobile spare parts, LCD combos, original batteries, tempered glass, covers & CC boards in Kishanganj.">
<link rel="stylesheet" href="../style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
  body {
    background: #f8fafc;
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
  }
  .parts-header-bar {
    background: #0f172a;
    color: white;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .back-home-btn {
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #0284c7;
    padding: 8px 16px;
    border-radius: 20px;
    transition: background 0.2s;
  }
  .back-home-btn:hover {
    background: #0369a1;
  }
  .parts-page-wrapper {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
  }
  .page-intro {
    text-align: center;
    margin-bottom: 25px;
  }
  .page-intro h1 {
    font-size: 26px;
    color: #0f172a;
    margin: 8px 0;
  }
  .page-intro p {
    color: #64748b;
    font-size: 14px;
    margin: 0;
  }
  .spares-search-wrap {
    max-width: 650px;
    margin: 20px auto 15px;
    position: relative;
  }
  .spares-search-wrap input {
    width: 100%;
    padding: 14px 20px 14px 45px;
    font-size: 15px;
    border: 2px solid #0284c7;
    border-radius: 30px;
    outline: none;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(2, 132, 199, 0.1);
  }
  .spares-search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #0284c7;
    font-size: 17px;
  }
  .spares-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }
  .spares-tab-btn {
    padding: 7px 16px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #334155;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .spares-tab-btn.active-tab {
    background: #0284c7;
    color: #ffffff;
    border-color: #0284c7;
  }
  .spares-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 15px;
  }
  .spare-item-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 15px;
    text-align: left;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .spare-item-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.08);
  }
  .spare-cat-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    display: inline-block;
    margin-bottom: 8px;
    width: fit-content;
  }
  .pill-lcd { background: #e0f2fe; color: #0369a1; }
  .pill-battery { background: #dcfce7; color: #15803d; }
  .pill-touchglass { background: #fef08a; color: #854d0e; }
  .pill-backcover { background: #fce7f3; color: #9d174d; }
  .pill-fastcharger { background: #fee2e2; color: #b91c1c; }
  .pill-subcc { background: #ffedd5; color: #c2410c; }
  .pill-headphone { background: #ede9fe; color: #6d28d9; }
  .pill-datacable { background: #ccfbf1; color: #0f766e; }
  .pill-default { background: #e2e8f0; color: #334155; }

  .order-whatsapp-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #25D366;
    color: white;
    text-decoration: none;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 12px;
  }
</style>
</head>
<body>

<div class="parts-header-bar">
  <div style="display: flex; align-items: center; gap: 10px;">
    <img src="../logo-round.png" alt="Logo" style="width: 34px; height: 34px; border-radius: 50%;">
    <strong style="font-size: 16px;">★ 4 STAR MOBILE ★</strong>
  </div>
  <a href="../index.html" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Home Page Par Jayein</a>
</div>

<div class="parts-page-wrapper">
  <div class="page-intro">
    <span style="background: #0284c7; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700;">★ 100% GENUINE MOBILE SPARES DIRECTORY</span>
    <h1>Mobile Parts & Model Compatibility List</h1>
    <p>Apne smartphone ke hisaab se compatible display combo, battery code aur spare parts search karein</p>
    
    <div class="spares-search-wrap">
      <i class="fa-solid fa-magnifying-glass spares-search-icon"></i>
      <input 
        type="text" 
        id="sparesSearchInput" 
        placeholder="Search model, brand ya part number (e.g. Vivo Y200, BN53, Reno, M14)..."
        autocomplete="off"
        autofocus
      >
    </div>

    <div class="spares-tabs">
      <button type="button" class="spares-tab-btn active-tab" onclick="setSparesFilter('all')">All Spare Parts</button>
      <button type="button" class="spares-tab-btn" onclick="setSparesFilter('LCD')">LCD Displays</button>
      <button type="button" class="spares-tab-btn" onclick="setSparesFilter('Battery')">Li-ion Batteries</button>
      <button type="button" class="spares-tab-btn" onclick="setSparesFilter('Touch Glass')">Touch & Tempered</button>
      <button type="button" class="spares-tab-btn" onclick="setSparesFilter('Back Cover')">Back Covers</button>
      <button type="button" class="spares-tab-btn" onclick="setSparesFilter('Sub CC')">Charging CC Boards</button>
      <button type="button" class="spares-tab-btn" onclick="setSparesFilter('Fast Charger')">Chargers & Adapters</button>
    </div>
  </div>

  <div id="sparesDisplayGrid" class="spares-cards-grid">
    <p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Google Sheet se parts directory load ho rahi hai...</p>
  </div>
</div>

<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1V4L-QSjipuuOSN774KsxOuJCuyGB5mSsuylf7_i8TtM/export?format=csv";

  let sparePartsDatabase = [];
  let currentSpareFilter = "all";

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    const result = [];
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      if (row.length >= 3) {
        result.push({
          category: row[0]?.replace(/^"|"$/g, '').trim() || "Spares",
          title: row[1]?.replace(/^"|"$/g, '').trim() || "",
          compatible: row[2]?.replace(/^"|"$/g, '').trim() || "",
          specs: row[3]?.replace(/^"|"$/g, '').trim() || "",
          imageUrl: row[4]?.replace(/^"|"$/g, '').trim() || ""
        });
      }
    }
    return result;
  }

  async function loadPartsFromSheet() {
    const container = document.getElementById("sparesDisplayGrid");
    try {
      const res = await fetch(SHEET_CSV_URL);
      const csvText = await res.text();
      sparePartsDatabase = parseCSV(csvText);
      renderSparePartsDirectory();
    } catch (error) {
      console.error(error);
      if (container) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red;">Parts load nahi ho sake. Kripya check karein Google Sheet public hai ya nahi.</p>`;
      }
    }
  }

  function getPillClass(cat) {
    const c = cat.toLowerCase();
    if (c.includes("lcd")) return "pill-lcd";
    if (c.includes("battery")) return "pill-battery";
    if (c.includes("glass")) return "pill-touchglass";
    if (c.includes("cover")) return "pill-backcover";
    if (c.includes("sub cc")) return "pill-subcc";
    if (c.includes("charger")) return "pill-fastcharger";
    if (c.includes("headphone")) return "pill-headphone";
    if (c.includes("cable")) return "pill-datacable";
    return "pill-default";
  }

  function renderSparePartsDirectory() {
    const input = document.getElementById("sparesSearchInput");
    const container = document.getElementById("sparesDisplayGrid");
    if (!input || !container) return;

    const query = input.value.toLowerCase().trim();
    container.innerHTML = "";

    const results = sparePartsDatabase.filter(item => {
      const matchCat = (currentSpareFilter === "all") || (item.category.toLowerCase() === currentSpareFilter.toLowerCase());
      const matchSearch = item.title.toLowerCase().includes(query) || 
                          item.compatible.toLowerCase().includes(query) ||
                          item.specs.toLowerCase().includes(query);
      return matchCat && matchSearch;
    });

    if (results.length === 0) {
      container.innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; padding: 40px 10px; color: #64748b;">
          <i class="fa-solid fa-circle-exclamation" style="font-size: 28px; color: #cbd5e1; margin-bottom: 10px; display: block;"></i>
          <strong>Koi part match nahi hua!</strong>
          <p style="margin: 5px 0 0 0; font-size: 13px;">Dusra model try karein ya direct WhatsApp par contact karein.</p>
        </div>`;
      return;
    }

    results.forEach(item => {
      const card = document.createElement("div");
      card.className = "spare-item-card";
      const imgHtml = item.imageUrl ? `<img src="${item.imageUrl}" style="width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px;">` : '';
      const waMsg = encodeURIComponent(`Hello 4 STAR MOBILE, mujhe ${item.title} chahiye. Available hai kya?`);

      card.innerHTML = `
        <div>
          ${imgHtml}
          <span class="spare-cat-pill ${getPillClass(item.category)}">${item.category}</span>
          <h4 style="margin: 0 0 6px 0; font-size: 15px; color: #0f172a; font-weight: 600;">${item.title}</h4>
          <p style="margin: 0 0 4px 0; font-size: 13px; color: #64748b; line-height: 1.4;">
            <strong style="color: #334155;">Compatible:</strong> ${item.compatible}
          </p>
          ${item.specs ? `<small style="color: #0284c7; font-weight: 500;">⚡ ${item.specs}</small>` : ''}
        </div>
        <a href="https://wa.me/919473185145?text=${waMsg}" target="_blank" class="order-whatsapp-btn">
          <i class="fa-brands fa-whatsapp"></i> Enquiry / Order
        </a>
      `;
      container.appendChild(card);
    });
  }

  function setSparesFilter(cat) {
    currentSpareFilter = cat;
    document.querySelectorAll(".spares-tab-btn").forEach(btn => {
      const isMatch = (cat === "all" && btn.innerText.includes("All")) || 
                      (btn.innerText.toLowerCase().includes(cat.toLowerCase()));
      btn.classList.toggle("active-tab", isMatch);
    });
    renderSparePartsDirectory();
  }

  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("sparesSearchInput");
    if (input) {
      input.addEventListener("input", renderSparePartsDirectory);
    }
    loadPartsFromSheet();
  });
</script>

</body>
</html>
